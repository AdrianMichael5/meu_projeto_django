<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 flex items-center justify-center h-screen">
    <form method="POST" class="bg-white p-8 rounded-xl shadow-lg w-96">
      {% csrf_token %}
      <h2 class="text-2xl font-bold mb-6 text-center">Entrar</h2>

      {% if erro %}
      <p class="text-red-500 text-sm mb-4 text-center">{{ erro }}</p>
      {% endif %}

      <input
        name="username"
        type="text"
        placeholder="Usuário"
        class="w-full mb-4 p-2 border border-gray-300 rounded"
        required
      />
      <input
        name="password"
        type="password"
        placeholder="Senha"
        class="w-full mb-4 p-2 border border-gray-300 rounded"
        required
      />

      <button
        type="submit"
        class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700"
      >
        Entrar
      </button>

      <p class="text-center mt-4 text-sm">
        Não tem conta?
        <a href="{% url 'cadastro' %}" class="text-blue-600 hover:underline"
          >Cadastre-se</a
        >
      </p>
    </form>
  </body>
</html>
